# One-off: find the product search API behind gamestheshop.com (client-side search).
name: Games The Shop probe
on:
  push:
    paths: ['.github/workflows/gts-probe.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan
        run: |
          set +e
          UA='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130 Safari/537.36'
          mkdir -p /tmp/g && cd /tmp/g
          for p in "/" "/search?q=spider-man%202" "/playstation"; do curl -sL -A "$UA" "https://www.gamestheshop.com$p"; done > pages.html
          echo "pages bytes: $(wc -c < pages.html)" > out.txt
          grep -oE '/_next/static/chunks/[A-Za-z0-9_.~-]+\.js' pages.html | sort -u > chunks.txt
          while read -r c; do curl -sL -A "$UA" "https://www.gamestheshop.com$c" -o "$(basename $c)"; done < chunks.txt
          { echo "chunks: $(ls *.js | wc -l)"
            echo "== hosts"; grep -ohE 'https?://[A-Za-z0-9.-]+\.[a-z]{2,}[A-Za-z0-9/_.-]*' *.js | grep -viE 'w3\.org|react|nextjs|vercel|google|facebook|schema\.org|github' | sort | uniq -c | sort -rn | head -40
            echo "== api paths"; grep -ohE '["`'"'"'](/api/[A-Za-z0-9/_${}.-]+|/v[0-9]/[A-Za-z0-9/_${}.-]+|/store/[A-Za-z0-9/_${}.-]+)' *.js | sort | uniq -c | sort -rn | head -40
            echo "== search context"; grep -ohE '.{120}(initialQ|searchProducts|/search\?|q=\$\{|query=\$\{).{160}' *.js | head -15
            echo "== env"; grep -ohE 'NEXT_PUBLIC_[A-Z_]+.{0,100}' *.js | sort -u | head -20
            echo "== storefront paths"; grep -ohE '["`'"'"']/?storefront/[A-Za-z0-9/_${}.?=&-]+' *.js | sort -u | head -60
            echo "== products/filter ctx"; grep -ohE '.{700}storefront/products/filter.{500}' *.js | head -3
            echo "== export ctx"; grep -ohE '.{900}"searchProductsAPI".{200}' *.js | head -2
            echo "== proxy"; grep -ohE '.{200}/api/proxy.{300}' *.js | head -3
            echo "== base url"; grep -ohE '.{120}green-api\.gamestheshop\.com.{200}' *.js | head -4
          } >> out.txt
          mkdir -p $GITHUB_WORKSPACE/probe && cp out.txt $GITHUB_WORKSPACE/probe/gts.txt
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add probe
          git diff --cached --quiet || git commit -m "Games The Shop probe output"
          git pull --rebase -q && git push

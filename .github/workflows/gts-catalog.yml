# Captures Games The Shop's PS5 physical games catalogue from its storefront API
# (POST green-api.gamestheshop.com/storefront/products/filter) into catalog/gts/.
name: Games The Shop catalogue
on:
  push:
    paths: ['.github/workflows/gts-catalog.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pages
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.request, urllib.parse
          os.makedirs('catalog/gts', exist_ok=True)
          for f in os.listdir('catalog/gts'): os.remove('catalog/gts/' + f)
          H = {'Content-Type': 'application/json', 'Origin': 'https://www.gamestheshop.com', 'Referer': 'https://www.gamestheshop.com/',
               'User-Agent': 'Lowscore/0.1 (price comparison; https://github.com/SiriusBlack2196/ps5-deal-finder)'}
          def post(body, page, limit):
              url = 'https://green-api.gamestheshop.com/storefront/products/filter?' + urllib.parse.urlencode({'page': page, 'limit': limit})
              req = urllib.request.Request(url, data=json.dumps(body).encode(), headers=H, method='POST')
              return json.load(urllib.request.urlopen(req, timeout=30))
          dbg = []
          t = post({'searchQuery': 'spider-man 2', 'platforms': ['PS5'], 'is_digital': False}, 1, 3)
          dbg.append('test keys: ' + str(list(t.keys())) + ' meta: ' + json.dumps(t.get('meta')))
          if t.get('data'): open('catalog/gts/sample.json', 'w').write(json.dumps(t['data'][0], indent=1))
          dbg.append('test titles: ' + str([p.get('title') or p.get('name') for p in t.get('data', [])]))
          body = {'platforms': ['PS5'], 'categories': ['Game Software'], 'is_digital': False}
          page, total = 1, 0
          while page <= 40:
              r = post(body, page, 100)
              data = r.get('data') or []
              if not data: break
              json.dump(data, open(f'catalog/gts/gts-{page:02d}.json', 'w'))
              total += len(data); dbg.append(f'page {page}: {len(data)} meta {json.dumps(r.get("meta"))}')
              if len(data) < 100: break
              page += 1; time.sleep(1)
          dbg.append(f'total {total}')
          open('catalog/gts/debug.txt', 'w').write('\n'.join(dbg) + '\n')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog/gts
          git diff --cached --quiet || git commit -m "Games The Shop catalogue: $(ls catalog/gts | wc -l) files"
          git pull --rebase -q && git push

# Square key art for the home page's "Latest releases" tiles, plus release dates for
# games Metacritic hasn't dated yet (pre-orders). Source: the game's playstation.com
# page — <meta name="image"> is the 1:1 store art; <meta name="releaseDate"> the date.
# Output: heroes/tiles/<sha>.webp (480x480), heroes/tiles.json {key: {file, src, page}},
# and gaps in ratings/dates.json filled (never overwrites a Metacritic date).
name: Square tiles
on:
  push:
    paths: ['.github/workflows/tiles.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  tiles:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install requests pillow
      - name: Fetch square art
        run: |
          python - <<'PY'
          import json, re, os, io, time, hashlib, html, datetime, requests
          from PIL import Image
          os.makedirs('heroes/tiles', exist_ok=True)
          titles = json.load(open('ratings/titles.json'))
          dates = json.load(open('ratings/dates.json'))
          try: out = json.load(open('heroes/tiles.json'))
          except Exception: out = {}
          s = requests.Session(); s.headers.update({'User-Agent': 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130 Safari/537.36', 'Accept-Language': 'en-IN,en;q=0.9'})
          ED = r'\b(standard|deluxe|ultimate|gold|premium|launch|day one|day 1|complete|definitive|special|limited|collector\'?s|anniversary|goty|game of the year|edition|bundle|ps5|ps4|steelbook)\b'
          def clean(t):
              t = re.sub(r'[\(\[].*?[\)\]]', ' ', t)
              t = re.sub(ED, ' ', t, flags=re.I)
              return re.sub(r'\s+', ' ', t).strip(' -:')
          def slug(t): return re.sub(r'[^a-z0-9]+', '-', re.sub(r"[’']", '', t.lower()).replace('&', 'and')).strip('-')
          ROMAN = {'2': 'ii', '3': 'iii', '4': 'iv', '5': 'v', '6': 'vi', '7': 'vii', '8': 'viii'}
          def candidates(t):
              base = slug(clean(t)); c = [base, slug(t)]
              words = base.split('-')
              c.append('-'.join(ROMAN.get(w, w) for w in words))
              c.append('-'.join({v: k for k, v in ROMAN.items()}.get(w, w) for w in words))
              if words and words[0] == 'the': c.append('-'.join(words[1:]))
              if words and words[0] == 'marvel': c.append('marvels-' + '-'.join(words[1:]))
              return list(dict.fromkeys(x for x in c if x))
          STOP = {'the', 'of', 'a', 'and', 'marvels', 'marvel', 'tom', 'clancys', 'sid', 'meiers', 'ps5', 'ps4'}
          def toks(t): return re.findall(r'[a-z0-9]+', re.sub(r"[’']", '', html.unescape(t).lower()))
          def match(ours, theirs):
              a = [w for w in toks(clean(ours)) if w not in STOP]; b = [w for w in toks(theirs) if w not in STOP]
              norm = lambda w: {v: k for k, v in ROMAN.items()}.get(w, w)
              a = [norm(w) for w in a]; b = set(norm(w) for w in b)
              return bool(a) and all(w in b for w in a) and len(b) - len(a) <= 3
          def meta(h, name):
              m = re.search(r'<meta[^>]+(?:name|property)="' + re.escape(name) + r'"[^>]+content="([^"]*)"', h) or \
                  re.search(r'<meta[^>]+content="([^"]*)"[^>]+(?:name|property)="' + re.escape(name) + r'"', h)
              return m and html.unescape(m.group(1))
          debug = {}; done = 0; dated = 0
          for t in titles:
              key, title = t['key'], t['title']
              have = key in out and os.path.exists('heroes/tiles/' + out[key]['file'])
              if have and dates.get(key): done += 1; continue
              for sl in candidates(title):
                  try: r = s.get(f'https://www.playstation.com/en-in/games/{sl}/', timeout=20)
                  except Exception as e: debug[key] = str(e); break
                  time.sleep(0.6)
                  if r.status_code != 200: continue
                  name = meta(r.text, 'name') or meta(r.text, 'og:title') or ''
                  if not match(title, name): debug[key] = f'mismatch {sl}: {name}'; continue
                  rd = meta(r.text, 'releaseDate')
                  if rd and not dates.get(key):
                      try:
                          d = datetime.datetime.fromisoformat(rd.replace('Z', '+00:00')) + datetime.timedelta(hours=5, minutes=30)
                          dates[key] = d.date().isoformat(); dated += 1
                      except Exception: pass
                  if have: break
                  for img in [meta(r.text, 'image'), meta(r.text, 'og:image')]:
                      if not img: continue
                      try:
                          ir = s.get(img.split('?')[0] + '?w=720', timeout=30); ir.raise_for_status()
                          im = Image.open(io.BytesIO(ir.content)).convert('RGB')
                      except Exception as e: debug[key] = f'img {e}'; continue
                      w, h = im.size
                      if not 0.9 <= w / h <= 1.1: debug[key] = f'not square {w}x{h}'; continue
                      side = min(w, h); im = im.crop(((w - side) // 2, (h - side) // 2, (w + side) // 2, (h + side) // 2)).resize((480, 480), Image.LANCZOS)
                      f = hashlib.sha1(key.encode()).hexdigest()[:12] + '.webp'
                      im.save('heroes/tiles/' + f, 'WEBP', quality=70, method=6)
                      out[key] = {'file': f, 'src': img, 'page': sl}; done += 1; debug.pop(key, None)
                      break
                  break
          json.dump(out, open('heroes/tiles.json', 'w'), indent=1, sort_keys=True)
          json.dump(dict(sorted(dates.items())), open('ratings/dates.json', 'w'), indent=1)
          json.dump(debug, open('heroes/tiles-debug.json', 'w'), indent=1, sort_keys=True)
          print('tiles', done, 'new dates', dated)
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add heroes ratings/dates.json
          git diff --cached --quiet || git commit -m "Square tiles: $(ls heroes/tiles | wc -l)"
          git pull --rebase -q && git push

# Captures CeX India's PS5 games (its public Algolia search index, the same one
# in.webuy.com queries from the browser) into catalog/cex/. Also writes a small
# probe file (facets + sample hit) to help keep the adapter mapping honest.
name: CeX catalogue
on:
  push:
    paths: ['.github/workflows/cex-catalog.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.parse, urllib.request
          APP, KEY, IDX = 'LNNFEEWZVA', 'bf79f2b6699e60a18ae330a1248b452c', 'prod_cex_in'
          H = {'X-Algolia-Application-Id': APP, 'X-Algolia-API-Key': KEY, 'Content-Type': 'application/json',
               'Origin': 'https://in.webuy.com', 'Referer': 'https://in.webuy.com/', 'User-Agent': 'Mozilla/5.0 (Lowscore price comparison)'}
          def q(params, host=f'https://{APP}-dsn.algolia.net'):
              body = json.dumps({'params': urllib.parse.urlencode(params)}).encode()
              req = urllib.request.Request(f'{host}/1/indexes/{IDX}/query', data=body, headers=H, method='POST')
              return json.load(urllib.request.urlopen(req, timeout=30))
          os.makedirs('catalog/cex', exist_ok=True)
          probe = {}
          try:
              r = q({'query': 'playstation 5', 'hitsPerPage': 3, 'facets': '["categoryName","superCatName","categoryFriendlyName"]', 'maxValuesPerFacet': 200})
          except Exception as e:
              print('direct failed', e); r = q({'query': 'playstation 5', 'hitsPerPage': 3, 'facets': '["categoryName","superCatName"]', 'maxValuesPerFacet': 200}, host='https://search.webuy.io')
          probe['facets'] = {k: {n: c for n, c in v.items() if 'ay' in n.lower() or 'ps' in n.lower()} for k, v in (r.get('facets') or {}).items()}
          probe['sampleHit'] = (r.get('hits') or [None])[0]
          json.dump(probe, open('catalog/cex/probe.json', 'w'), indent=1)
          cats = [n for n in (r.get('facets') or {}).get('categoryName', {}) if 'playstation5' in n.lower().replace(' ', '') and 'game' in n.lower()]
          print('PS5 game categories:', cats)
          hits, page = [], 0
          while cats:
              fil = ' OR '.join(f'categoryName:"{c}"' for c in cats)
              r = q({'query': '', 'filters': fil, 'hitsPerPage': 1000, 'page': page})
              hits += r.get('hits', []); print('page', page, len(r.get('hits', [])), 'of', r.get('nbHits'))
              page += 1
              if page >= r.get('nbPages', 0): break
              time.sleep(1)
          json.dump(hits, open('catalog/cex/hits.json', 'w'))
          print('total', len(hits))
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog/cex
          git diff --cached --quiet || git commit -m "CeX catalogue: $(python3 -c "import json;print(len(json.load(open('catalog/cex/hits.json'))))" 2>/dev/null) items"
          git pull --rebase -q && git push

# Captures CeX India's PS5 games (its public Algolia search index, the same one
# in.webuy.com queries from the browser) into catalog/cex/. Also writes a small
# probe file (facets + sample hit) to help keep the adapter mapping honest.
name: CeX catalogue
on:
  push:
    paths: ['.github/workflows/cex-catalog.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.parse, urllib.request
          APP, KEY, IDX = 'LNNFEEWZVA', 'bf79f2b6699e60a18ae330a1248b452c', 'prod_cex_in'
          H = {'X-Algolia-Application-Id': APP, 'X-Algolia-API-Key': KEY, 'Content-Type': 'application/json',
               'Origin': 'https://in.webuy.com', 'Referer': 'https://in.webuy.com/', 'User-Agent': 'Mozilla/5.0 (Lowscore price comparison)'}
          def q(params, host=f'https://{APP}-dsn.algolia.net'):
              body = json.dumps({'params': urllib.parse.urlencode(params)}).encode()
              req = urllib.request.Request(f'{host}/1/indexes/{IDX}/query', data=body, headers=H, method='POST')
              return json.load(urllib.request.urlopen(req, timeout=30))
          os.makedirs('catalog/cex', exist_ok=True)
          # The index doesn't allow category filters, so search broadly and keep the
          # "Playstation5 Games" hits: a few generic queries plus every catalogue title.
          titles = [t['title'] for t in json.load(open('ratings/titles.json'))]
          queries = ['ps5', 'playstation 5', 'ps5 game', 'ps5 games'] + titles
          seen = {}
          for i, term in enumerate(queries):
              for page in range(3 if i < 4 else 1):
                  try: r = q({'query': term, 'hitsPerPage': 1000 if i < 4 else 40, 'page': page})
                  except Exception as e: print('ERR', term, e); break
                  for h in r.get('hits', []):
                      if (h.get('categoryName') or '').lower().replace(' ', '') == 'playstation5games':
                          h.pop('_highlightResult', None); h.pop('_snippetResult', None); seen[h['boxId']] = h
                  if page + 1 >= r.get('nbPages', 0): break
              time.sleep(0.15)
          hits = list(seen.values())
          print('PS5 game boxes', len(hits), 'new', sum(1 for h in hits if h.get('new')), 'in store', sum(1 for h in hits if h.get('inStockStore')), 'online', sum(1 for h in hits if h.get('inStockOnline')))
          json.dump(hits, open('catalog/cex/hits.json', 'w'))
          print('total', len(hits))
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog/cex
          git diff --cached --quiet || git commit -m "CeX catalogue: $(python3 -c "import json;print(len(json.load(open('catalog/cex/hits.json'))))" 2>/dev/null) items"
          git pull --rebase -q && git push

# Downloads game covers listed in thumbs/urls.json, shrinks them to WebP
# (thumbs/out: 180px, thumbs/lg: up to 520px) and commits them. Used to embed covers in the
# claude.ai artifact build, which cannot load images from store servers.
name: Build thumbnails
on:
  push:
    paths: ['thumbs/urls.json', 'thumbs/trim.py', '.github/workflows/thumbs.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  thumbs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install pillow requests
      - name: Fetch and resize
        run: |
          python - <<'PY'
          import json, io, os, sys, time, requests
          sys.path.insert(0, 'thumbs'); from trim import trim_frame, portraitize
          from PIL import Image
          os.makedirs('thumbs/out', exist_ok=True); os.makedirs('thumbs/lg', exist_ok=True)
          items = json.load(open('thumbs/urls.json'))
          ok = fail = 0
          s = requests.Session()
          s.headers['User-Agent'] = 'Lowscore/0.1 (thumbnail cache; https://github.com/SiriusBlack2196/ps5-deal-finder)'
          for it in items:
              out = f"thumbs/out/{it['file']}"   # small: lists, autocomplete
              lg = f"thumbs/lg/{it['file']}"     # large: deal cards, results header (2x screens)
              if os.path.exists(out) and os.path.exists(lg):
                  ok += 1; continue
              try:
                  r = s.get(it['url'], timeout=20); r.raise_for_status()
                  src, _ = trim_frame(Image.open(io.BytesIO(r.content)).convert('RGB'))
                  src, _ = portraitize(src)   # wide promo art -> portrait cover
                  big = src.copy(); big.thumbnail((520, 700), Image.LANCZOS)
                  big.save(lg, 'WEBP', quality=76, method=6)
                  if not os.path.exists(out):
                      im = src.copy(); im.thumbnail((180, 240), Image.LANCZOS)
                      im.save(out, 'WEBP', quality=72, method=6)
                  ok += 1
              except Exception as e:
                  fail += 1; print('FAIL', it['key'], it['url'], e)
              time.sleep(0.25)  # be polite to the stores
          print(f'ok={ok} fail={fail}')
          PY
      - name: Commit thumbnails
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add thumbs/out thumbs/lg
          git diff --cached --quiet || git commit -m "Thumbnails: $(ls thumbs/out | wc -l) covers"
          git push

# One-off: locate Game Nation's API base URL and endpoint map in its JS bundle,
# then try a search request. Output is committed to probe/gamenation.txt.
name: Game Nation probe
on:
  push:
    paths: ['.github/workflows/gn-probe.yml', 'probe/gn-request.txt']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan bundle
        run: |
          set +e
          UA='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130 Safari/537.36'
          mkdir -p /tmp/gn && cd /tmp/gn
          for p in / /Products/Games /searchresults?term=spider; do curl -sL -A "$UA" "https://www.gamenation.in$p"; done > pages.html
          grep -oE '/_next/static/chunks/[A-Za-z0-9_.~-]+\.js' pages.html | sort -u > chunks.txt
          while read -r c; do curl -sL -A "$UA" "https://www.gamenation.in$c" -o "$(basename $c)"; done < chunks.txt
          # chunks referenced from other chunks
          grep -ohE 'static/chunks/[A-Za-z0-9_.~-]+\.js' *.js | sort -u | while read -r c; do f=$(basename $c); [ -f "$f" ] || curl -sL -A "$UA" "https://www.gamenation.in/_next/$c" -o "$f"; done
          mkdir -p $GITHUB_WORKSPACE/probe; OUT=$GITHUB_WORKSPACE/probe/gamenation.txt
          { echo "chunks: $(ls *.js | wc -l)"
            echo "== baseURL"; grep -ohE '.{0,200}baseURL.{0,300}' *.js | head -20
            echo "== API_ENDPOINTS def"; grep -ohE '.{0,50}(71862|47621),[^\[]{0,40}e=>\{.{0,3000}' *.js | head -5
            echo "== api hosts"; grep -ohE 'https?://[A-Za-z0-9.-]*(gamenation|api)[A-Za-z0-9./_-]*' *.js pages.html | sort | uniq -c | sort -rn | head -40
            echo "== NEXT_PUBLIC"; grep -ohE 'NEXT_PUBLIC_[A-Z_]+.{0,120}' *.js | sort -u | head -30
            echo "== Products paths"; grep -ohE '"/[A-Za-z]+/[A-Za-z/]*(Index|Search|Suggest)[A-Za-z/]*"' *.js | sort -u | head -60
          } > "$OUT"
          # optional follow-up requests listed in probe/gn-request.txt (one URL per line)
          if [ -f $GITHUB_WORKSPACE/probe/gn-request.txt ]; then
            while read -r u; do [ -z "$u" ] && continue; echo "== GET $u" >> "$OUT"
              curl -s -m 20 -A "$UA" -H 'Accept: application/json' -H 'Origin: https://www.gamenation.in' -H 'Referer: https://www.gamenation.in/' -w '\n[status %{http_code}]\n' "$u" | head -c 6000 >> "$OUT"; echo >> "$OUT"
            done < $GITHUB_WORKSPACE/probe/gn-request.txt
          fi
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add probe
          git diff --cached --quiet || git commit -m "Game Nation probe output"
          git pull --rebase -q && git push

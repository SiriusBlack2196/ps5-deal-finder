# Fly.io: `fly launch --copy-config --no-deploy` then `fly deploy`.
app = "ps5-deal-finder"
primary_region = "bom"       # Mumbai — same country as the stores

[build]

[env]
  PORT = "8787"
  DB_PATH = "/data/prices.db"

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    path = "/api/health"
    interval = "30s"
    timeout = "3s"

[mounts]
  source = "prices"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
